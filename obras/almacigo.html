<style>
  .volver{position:fixed;top:14px;left:14px;z-index:99;font:600 12.5px/1 ui-sans-serif,system-ui,-apple-system,sans-serif;
    text-decoration:none;padding:8px 14px;border-radius:999px;backdrop-filter:blur(10px);
    background:color-mix(in srgb,Canvas 78%,transparent);color:CanvasText;

  .volver:focus-visible{outline:2px solid #EC4899;outline-offset:3px}
  @media print{.volver{display:none}}

<style>
  /* Paleta tomada de src/constants/theme.ts */
  :root {
    --fondo: #FBFAF7;
    --superficie: #FFFFFF;
    --superficie-alt: #F2F0EA;
    --texto: #1F1D18;
    --texto-suave: #6B665C;
    --texto-tenue: #97918A;
    --borde: #E3DFD5;
    --borde-fuerte: #CFC9BB;
    --acento: #4A6B4F;
    --acento-texto: #FFFFFF;
    --acento-suave: #E6EDE4;
    --atencion: #A85D27;
    --marco: #2A2822;
    --sombra: 0 1px 2px rgba(31,29,24,.05), 0 8px 28px rgba(31,29,24,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fondo: #14140F; --superficie: #1D1C17; --superficie-alt: #26251F;
      --texto: #EDEAE1; --texto-suave: #A8A296; --texto-tenue: #7C776D;
      --borde: #33322A; --borde-fuerte: #474539;
      --acento: #8FB795; --acento-texto: #14140F; --acento-suave: #232C22;
      --atencion: #D9924F; --marco: #000000;
      --sombra: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --fondo: #14140F; --superficie: #1D1C17; --superficie-alt: #26251F;
    --texto: #EDEAE1; --texto-suave: #A8A296; --texto-tenue: #7C776D;
    --borde: #33322A; --borde-fuerte: #474539;
    --acento: #8FB795; --acento-texto: #14140F; --acento-suave: #232C22;
    --atencion: #D9924F; --marco: #000000;
    --sombra: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .hoja { max-width: 1180px; margin: 0 auto; padding: 64px 28px 88px; }

  /* ── Portada ─────────────────────────────────────────────────────────── */
  .portada { margin-bottom: 72px; }
  .marca {
    font-size: clamp(44px, 9vw, 76px);
    line-height: 1;
    font-weight: 600;
    letter-spacing: -.03em;
    margin: 0 0 14px;
  }
  .lema {
    font-size: clamp(17px, 2.2vw, 20px);
    color: var(--texto-suave);
    margin: 0 0 26px;
    max-width: 44ch;
    text-wrap: balance;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    padding: 5px 11px;
    border: 1px solid var(--borde);
    border-radius: 999px;
    color: var(--texto-suave);
    background: var(--superficie);
    white-space: nowrap;
  }

  section { margin-bottom: 76px; }

  .rotulo {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--texto-tenue);
    margin: 0 0 22px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .rotulo::after { content: ""; flex: 1; height: 1px; background: var(--borde); }

  .grupo { font-size: 13px; font-weight: 600; color: var(--texto-tenue); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 18px; }

  /* ── Mapa ────────────────────────────────────────────────────────────── */
  .mapa-caja { overflow-x: auto; padding-bottom: 8px; }
  .mapa { min-width: 880px; width: 100%; height: auto; display: block; }
  .mapa text { font-family: ui-sans-serif, system-ui, sans-serif; }

  /* ── Galería ─────────────────────────────────────────────────────────── */
  .galeria {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
    gap: 40px 28px;
    margin-bottom: 56px;
  }
  .galeria:last-child { margin-bottom: 0; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; }
  figcaption {
    margin-top: 14px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--texto);
    text-align: center;
  }
  figcaption span {
    display: block;
    font-weight: 400;
    font-size: 12px;
    color: var(--texto-tenue);
    margin-top: 2px;
  }

  /* ── El teléfono ─────────────────────────────────────────────────────── */
  .fono {
    width: 268px;
    height: 552px;
    background: var(--marco);
    border-radius: 34px;
    padding: 8px;
    box-shadow: var(--sombra);
  }
  .vidrio {
    height: 100%;
    background: var(--fondo);
    border-radius: 27px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .estado {
    height: 26px; flex: 0 0 26px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    font-size: 10px; font-weight: 600; color: var(--texto); opacity: .55;
  }
  .lienzo { flex: 1; overflow: hidden; padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .lienzo.pegado > .abajo { margin-top: auto; }

  /* Tipografía espejo de src/constants/theme.ts */
  .t-display  { font-size: 26px; line-height: 30px; font-weight: 600; letter-spacing: -.01em; }
  .t-titulo   { font-size: 20px; line-height: 25px; font-weight: 600; letter-spacing: -.01em; }
  .t-sub      { font-size: 15px; line-height: 20px; font-weight: 600; }
  .t-cuerpo   { font-size: 13px; line-height: 19px; }
  .t-fuerte   { font-size: 13px; line-height: 19px; font-weight: 600; }
  .t-apoyo    { font-size: 11.5px; line-height: 16px; }
  .t-etiqueta { font-size: 9.5px; line-height: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .c-suave { color: var(--texto-suave); }
  .c-tenue { color: var(--texto-tenue); }
  .c-acento { color: var(--acento); }
  .c-atencion { color: var(--atencion); }
  .centrado { text-align: center; }

  .nav { display: flex; align-items: center; justify-content: space-between; height: 22px; flex: 0 0 22px; }
  .nav span { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--acento); font-weight: 500; }

  .tarj { background: var(--superficie); border: 1px solid var(--borde); border-radius: 13px; padding: 12px; }
  .tarj.marcada { background: var(--acento-suave); border-color: var(--acento); }

  .fila {
    display: flex; align-items: center; gap: 11px;
    background: var(--superficie); border: 1px solid var(--borde);
    border-radius: 13px; padding: 11px 12px;
  }
  .fila .txt { flex: 1; min-width: 0; }
  .fila.apagada { opacity: .55; }

  .ico { flex: 0 0 auto; width: 17px; height: 17px; stroke: var(--acento); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .ico.gris { stroke: var(--texto-tenue); }
  .ico.mini { width: 13px; height: 13px; }
  .chev { width: 12px; height: 12px; stroke: var(--texto-tenue); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

  .btn, .btn2, .btn3 {
    display: block; width: 100%; text-align: center;
    border-radius: 11px; padding: 10px 12px;
    font-size: 13px; font-weight: 600; border: 1px solid transparent;
  }
  .btn { background: var(--acento); color: var(--acento-texto); }
  .btn2 { background: transparent; color: var(--acento); border-color: var(--borde-fuerte); }
  .btn3 { background: transparent; color: var(--acento); padding: 7px 12px; }
  .btn3.izq { text-align: left; padding-left: 0; }

  .franja { background: var(--acento-suave); border-radius: 13px; padding: 22px 14px; text-align: center; display: flex; flex-direction: column; gap: 3px; }

  .mosaico { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .celda { background: var(--superficie); border: 1px solid var(--borde); border-radius: 13px; padding: 12px; display: flex; flex-direction: column; gap: 5px; min-height: 82px; }
  .celda.apagada { opacity: .55; }

  .opciones { display: flex; gap: 7px; }
  .opciones.col { flex-direction: column; }
  .op {
    flex: 1; text-align: center;
    border: 1px solid var(--borde-fuerte); border-radius: 10px;
    padding: 8px 6px; font-size: 12.5px; color: var(--texto-suave); background: var(--superficie);
  }
  .opciones.col .op { text-align: left; padding-left: 12px; }
  .op.sel { background: var(--acento-suave); border-color: var(--acento); color: var(--acento); font-weight: 600; }

  .campo { display: flex; flex-direction: column; gap: 5px; }
  .caja { border: 1px solid var(--borde-fuerte); background: var(--superficie); border-radius: 10px; padding: 9px 11px; font-size: 13px; color: var(--texto); }
  .caja.cursor { border-color: var(--acento); }

  .linea { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .divisor { height: 1px; background: var(--borde); margin: 3px 0; }

  .item { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px solid var(--borde); }
  .item:last-child { border-bottom: 0; }
  .marca-check { flex: 0 0 auto; width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--borde-fuerte); display: grid; place-items: center; }
  .marca-check.si { background: var(--acento); border-color: var(--acento); }
  .marca-check svg { width: 9px; height: 9px; stroke: var(--acento-texto); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .item .txt { flex: 1; min-width: 0; }

  .tabbar { flex: 0 0 44px; border-top: 1px solid var(--borde); background: var(--superficie); display: flex; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 9px; font-weight: 600; color: var(--texto-tenue); }
  .tab.on { color: var(--acento); }
  .tab .ico { stroke: currentColor; width: 16px; height: 16px; }

  .scrollcue { height: 3px; border-radius: 2px; background: var(--borde); width: 32px; margin: 2px auto 0; }

  footer {
    border-top: 1px solid var(--borde);
    padding-top: 24px;
    color: var(--texto-tenue);
    font-size: 13px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
  }

  @media (max-width: 640px) {
    .hoja { padding: 44px 18px 64px; }
    section { margin-bottom: 60px; }
    .galeria { gap: 34px 20px; }
  }
</style>

<div class="hoja">

  <header class="portada">
    <h1 class="marca">Almácigo</h1>
    <p class="lema">App de crianza compartida para familias separadas por la migración.</p>
    <div class="meta">
      <span class="pill">React Native</span>
      <span class="pill">Expo</span>
      <span class="pill">TypeScript</span>
      <span class="pill">Android · iOS</span>
      <span class="pill">2026</span>
    </div>
  </header>

  <section>
    <p class="rotulo">Flujo</p>
    <div class="mapa-caja">
      <svg class="mapa" viewBox="0 0 900 430" role="img" aria-label="Diagrama de navegación de la app">
        <defs>
          <marker id="punta" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
            <path d="M0 0.4 L7 3.2 L0 6" fill="none" stroke="var(--borde-fuerte)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>

        <g font-size="13" fill="var(--texto)">
          <text x="0" y="18" font-size="10" letter-spacing="1.4" fill="var(--texto-tenue)" font-weight="600">ENTRADA</text>
          <rect x="0" y="30" width="146" height="46" rx="10" fill="var(--superficie)" stroke="var(--borde)"/>
          <text x="16" y="59" font-weight="600">Bienvenida</text>

          <path d="M146 53 H192" stroke="var(--borde-fuerte)" stroke-width="1.4" fill="none" marker-end="url(#punta)"/>

          <rect x="196" y="30" width="146" height="46" rx="10" fill="var(--superficie)" stroke="var(--borde)"/>
          <text x="212" y="53" font-weight="600">Caminos</text>
          <text x="212" y="68" font-size="10.5" fill="var(--texto-tenue)">¿tuyo o de alguien?</text>

          <path d="M342 46 H368 V112" stroke="var(--borde-fuerte)" stroke-width="1.4" fill="none" marker-end="url(#punta)"/>
          <path d="M342 62 H368 V262" stroke="var(--borde-fuerte)" stroke-width="1.4" fill="none" marker-end="url(#punta)"/>

          <text x="392" y="106" font-size="10" letter-spacing="1.4" fill="var(--texto-tenue)" font-weight="600">ES MI HIJO</text>
          <rect x="392" y="116" width="122" height="42" rx="10" fill="var(--acento-suave)" stroke="var(--acento)"/>
          <text x="406" y="134" font-weight="600" font-size="12.5">1 · Fecha</text>
          <text x="406" y="149" font-size="10.5" fill="var(--texto-suave)">¿ya nació?</text>

          <path d="M514 137 H548" stroke="var(--borde-fuerte)" stroke-width="1.4" fill="none" marker-end="url(#punta)"/>
          <rect x="552" y="116" width="122" height="42" rx="10" fill="var(--acento-suave)" stroke="var(--acento)"/>
          <text x="566" y="134" font-weight="600" font-size="12.5">2 · Quiénes</text>
          <text x="566" y="149" font-size="10.5" fill="var(--texto-suave)">nombre y vínculo</text>

          <path d="M674 137 H708" stroke="var(--borde-fuerte)" stroke-width="1.4" fill="none" marker-end="url(#punta)"/>
          <rect x="712" y="116" width="122" height="42" rx="10" fill="var(--acento-suave)" stroke="var(--acento)"/>
          <text x="726" y="134" font-weight="600" font-size="12.5">3 · Listo</text>
          <text x="726" y="149" font-size="10.5" fill="var(--texto-suave)">aquí se crea</text>

          <text x="392" y="256" font-size="10" letter-spacing="1.4" fill="var(--texto-tenue)" font-weight="600">SE LO PREPARO A ALGUIEN</text>
          <rect x="392" y="266" width="122" height="42" rx="10" fill="var(--superficie)" stroke="var(--borde)"/>
          <text x="406" y="292" font-weight="600" font-size="12.5">1 · Fecha</text>

          <path d="M514 287 H548" stroke="var(--borde-fuerte)" stroke-width="1.4" fill="none" marker-end="url(#punta)"/>

          <path d="M773 158 V190" stroke="var(--borde-fuerte)" stroke-width="1.4" fill="none" marker-end="url(#punta)"/>
          <rect x="648" y="194" width="200" height="44" rx="10" fill="var(--superficie)" stroke="var(--borde-fuerte)" stroke-width="1.5"/>
          <text x="664" y="214" font-weight="600" font-size="12.5">Tablero del hijo</text>
          <text x="664" y="229" font-size="10.5" fill="var(--texto-suave)">listas · ficha · agenda · recuerdos</text>

          <text x="0" y="166" font-size="10" letter-spacing="1.4" fill="var(--texto-tenue)" font-weight="600">LA CASA</text>
          <rect x="0" y="176" width="146" height="46" rx="10" fill="var(--superficie)" stroke="var(--borde)"/>
